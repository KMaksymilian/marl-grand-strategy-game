# Decrees (gameplay specification §7): nation-wide policies.
#
# Each decree costs `base_upkeep_per_settlement × owned settlements ×
# cost_multiplier` gold from the national treasury every turn it is active.
# Enacted in turn T it waits (pending) until turn T+1, must stay active for
# `minimum_active_turns` before it can be revoked, and then cannot be enacted
# again for `cooldown_turns`. Unpaid upkeep revokes it automatically.
#
# Effects are data only. Each system applies the fields it owns; a field left
# out has no effect (fractions 0.0, multipliers 1.0, flags false). Fractions
# add up across decrees, multipliers multiply, flags combine with "or".
#
# `production` lists changes of output as fractions (+0.2 = +20%) for the
# materials of resources.toml that match `categories` and `tiers`; an empty or
# missing filter matches every material.

[rules]
base_upkeep_per_settlement = 10
minimum_active_turns = 5
cooldown_turns = 5
# Slots: `base_slots`, one more at `extra_slot_happiness` average happiness and
# one more for every further `extra_slot_happiness_step` points, at most `max_slots`.
base_slots = 2
max_slots = 6
extra_slot_happiness = 70.0
extra_slot_happiness_step = 10.0

[[decrees]]
id = "agricultural_decree"
name = "Agricultural Decree"
cost_multiplier = 1
[decrees.effects]
production = [
    { categories = ["raw_food"], tiers = [1], change = 0.2 },
    { categories = ["construction_material"], tiers = [1], change = -0.1 },
]

[[decrees]]
id = "craft_reform"
name = "Craft Reform"
cost_multiplier = 1
[decrees.effects]
production = [
