# Economic building defaults. Recipe quantities are per full cycle.
# Omitted biomes in an efficiency table forbid placement.

[tiers.1]
build_turns = 3
cycles_per_turn = 100
max_workers = 25

[tiers.2]
build_turns = 5
cycles_per_turn = 50
max_workers = 25

[tiers.3]
build_turns = 8
cycles_per_turn = 25
max_workers = 25

[[buildings]]
id = "plantation"
name = "Plantation"
tier = 1
cost = { wood = 200 }
biome_efficiencies = { grassland = 100, forest = 75, rainforest = 25, hills = 50, taiga = 25 }
recipes = [
    { outputs = { grain = 1 } },
]

[[buildings]]
id = "ranch"
name = "Ranch"
tier = 1
cost = { wood = 100, stone = 200 }
biome_efficiencies = { desert = 25, grassland = 75, forest = 50, rainforest = 25, hills = 100, taiga = 75, tundra = 25 }
recipes = [
    { outputs = { cattle = 1 } },
]

[[buildings]]
id = "waterfront"
name = "Waterfront"
tier = 1
cost = { wood = 200, stone = 100 }
requires_coast = true
recipes = [
    { outputs = { fish = 1 } },
]

[[buildings]]
